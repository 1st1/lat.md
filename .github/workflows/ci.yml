name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # Rust toolchain for the @lat.md/embed candle → WASM engine.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/embed/crate
      - name: Install wasm-bindgen-cli (matches Cargo.lock)
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Install wasm-opt (binaryen)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - run: pnpm install --frozen-lockfile

      # buildall = packages (WASM engine + fp16 weights + tsc) then top-level lat.
      - run: pnpm buildall
      - run: pnpm vitest run --reporter=verbose
