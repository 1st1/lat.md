name: Publish

on:
  push:
    branches: [main]

# Publishes any of the three packages whose version was bumped, in dependency
# order. Uses `pnpm publish` (not `npm publish`) so `workspace:*` deps in lat.md
# are rewritten to the real published versions.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: npm install -g npm@latest

      # Rust toolchain for the WASM engine build.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli (matches Cargo.lock)
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y binaryen ripgrep

      - run: pnpm install --frozen-lockfile

      # Each package's `build` runs its full chain (WASM engine / fp16 weights + tsc).
      - run: pnpm build:packages
      - run: pnpm build
      - run: pnpm vitest run --reporter=verbose

      # Publish each package whose local version is not yet on npm, in order.
      - name: Publish changed packages
        run: |
          publish_if_new() {
            local dir="$1"
            local name; name=$(node -p "require('./$dir/package.json').name")
            local ver; ver=$(node -p "require('./$dir/package.json').version")
            local pub; pub=$(npm view "$name@$ver" version 2>/dev/null || true)
            if [ "$pub" = "$ver" ]; then
              echo "$name@$ver already published, skipping"
            else
              echo "Publishing $name@$ver"
              (cd "$dir" && pnpm publish --provenance --access public --no-git-checks)
            fi
          }
          publish_if_new packages/embed-minilm-fp16
          publish_if_new packages/embed
          publish_if_new .

      - name: Create GitHub Release for lat.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          if ! gh release view "v$VER" >/dev/null 2>&1; then
            gh release create "v$VER" --title "v$VER" --generate-notes
          fi
