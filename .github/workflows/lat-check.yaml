name: lat check
on: [push, pull_request]

permissions:
  contents: read

jobs:
  lat-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm buildall
      - run: node dist/src/cli/index.js check
