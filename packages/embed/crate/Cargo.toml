[package]
name = "lat-embed-engine"
version = "0.1.0"
edition = "2021"
description = "candle-based BERT/MiniLM sentence-embedding engine compiled to WebAssembly for @lat.md/embed"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to 0.9.1 — candle `main` fails to build for wasm32-unknown-unknown (CurrentCpuBF16).
candle-core = { version = "=0.9.1", default-features = false }
candle-nn = { version = "=0.9.1", default-features = false }
candle-transformers = { version = "=0.9.1", default-features = false }

# unstable_wasm swaps onig (C) for pure-Rust regex so tokenizers builds for wasm32.
tokenizers = { version = "0.21.0", default-features = false, features = ["unstable_wasm"] }

num-traits = "0.2.15"
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.99"

# wasm glue
wasm-bindgen = "0.2.100"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.77"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
